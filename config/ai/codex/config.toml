model_provider = "LinkLM"
model = "gpt-5.6-sol"
review_model = "gpt-5.6-terra"
model_reasoning_effort = "high"
disable_response_storage = true
network_access = "enabled"

[model_providers.LinkLM]
name = "LinkLM"
base_url = "https://api.linklm.cc/v1"
wire_api = "responses"
requires_openai_auth = true

[marketplaces.ego-agent-skills]
source_type = "git"
source = "git@github.com:citrolabs/ego-lite.git"
ref = "main"

[marketplaces.agent-skills]
source_type = "git"
source = "https://github.com/addyosmani/agent-skills.git"

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."remotion@openai-api-curated"]
enabled = true

[plugins."build-macos-apps@openai-api-curated"]
enabled = true

[plugins."github@openai-api-curated"]
enabled = true

[plugins."build-web-apps@openai-api-curated"]
enabled = true

[plugins."record-and-replay@openai-bundled"]
enabled = true

[plugins."notion@openai-api-curated"]
enabled = true

[plugins."expo@openai-api-curated"]
enabled = true

[plugins."magicpath@openai-api-curated"]
enabled = true

[plugins."hyperframes@openai-api-curated"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."stripe@openai-curated"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."agent-skills@agent-skills"]
enabled = true

[features]
goals = true
js_repl = false
memories = true
chronicle = true

[mcp_servers.codebase-memory-mcp]
command = "codebase-memory-mcp"

[mcp_servers.codebase-memory-mcp.tools.detect_changes]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.get_architecture]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.index_status]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.list_projects]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.search_code]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.search_graph]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.index_repository]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.trace_path]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.get_code_snippet]
approval_mode = "approve"

# Keep the graph-discovery rule visible at session start without storing local hook state.
[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'echo "Code discovery: prefer codebase-memory-mcp (search_graph, trace_path, get_code_snippet, query_graph, search_code) over grep/file-read; run index_repository first if the project is not indexed."'

[memories]
generate_memories = true
use_memories = true
