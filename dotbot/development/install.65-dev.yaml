- link:
    ~/.config/mise/config.toml:
      path: config/mise/config.toml
      force: true
      create: true
- shell:
    - description: Apply AI harness configs ...
      command: python3 ./scripts/apply-ai-configs.py
      quiet: true
      stdout: true
      stderr: true
    - description: Install mise ...
      command: |
        if ! which mise &> /dev/null; then
        if [ "$(uname)" = "Darwin" ]; then
        brew install mise
        else
        sudo GHPKG_INSTALL_DIR=/usr/local/bin ~/.local/bin/ghpkg jdx/mise
        fi
        fi
      quiet: true
      stdout: false
      stderr: true
    - description: Install mise runtimes ...
      command: |
        . ./script/load-mise.sh
        mise install
      quiet: true
      stdout: false
      stderr: true
    - description: Install npm packages ...
      command: |
        . ./script/load-mise.sh
        npm i -g yarn git-cz

        if [ "$(uname)" != "Darwin" ]; then
        npm i -g @google/gemini-cli @openai/codex @anthropic-ai/claude-code
        fi
      quiet: true
      stdout: false
      stderr: true
    - description: Install python packages ...
      command: |
        . ./script/load-mise.sh
        pip install ydcv uv mycli
      quiet: true
      stdout: false
      stderr: true
    - description: Refresh mise shims ...
      command: |
        . ./script/load-mise.sh
        mise reshim
      quiet: true
      stdout: false
      stderr: true
    - description: Configure Codex default plugins ...
      command: >
        ./scripts/install-codex-plugins.py
        superpowers
        build-macos-apps
        build-web-apps
        build-ios-apps
        expo
      quiet: true
      stdout: false
      stderr: true
    - description: Enable Codex bundled plugins ...
      command: >
        ./scripts/enable-codex-bundled-plugins.py
        browser
        browser-use
        computer-use
        chrome
      quiet: true
      stdout: false
      stderr: true
